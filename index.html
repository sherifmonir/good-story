<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preload" href="/BG.jpg" as="image" fetchpriority="high" />
    <link
      rel="preload"
      href="/fonts/dm-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      const preloadFont = (font) => {
        const link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'font';
        link.type = 'font/woff2';
        link.crossOrigin = 'anonymous';
        link.href = font;
        document.head.append(link);
      };

      if (window.location.pathname === '/') {
        const heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.href = '/hero-img.webp';
        heroPreload.fetchPriority = 'high';
        document.head.append(heroPreload);
        preloadFont('/fonts/cinzel-latin.woff2');
      } else if (window.location.pathname.startsWith('/movie/')) {
        preloadFont('/fonts/dm-sans-italic-latin.woff2');
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover movies to enjoy, explore trending picks, and find detailed information about your next great story."
    />
    <title>Good Story</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
